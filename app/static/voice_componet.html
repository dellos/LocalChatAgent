    function sendUpdateEvent(id, text) {
        emitEvent('stt_text', { id: id, text: text });
    }
    function toggleVoiceProcessEvent(flg){
        emitEvent('stt_process',{onProcess:flg})
    }
    function bindingCallback(box_id){
        let chat_box_id = box_id;
        if ( window.ws.onMessageCallback) {
            return;
        }
        window.ws.onMessageCallback = async (text) => {
            console.log("Response from Python stt server:", text);
            try {
                if(text){
                    sendUpdateEvent(chat_box_id,text);
                    console.log("updated chat box");
                }
            } catch (err) {
                console.error('Network error:', err);
            }
        }
        window.myvad.onSpeechStart = async() =>{
            toggleVoiceProcessEvent(true)
        }
        window.myvad.onSpeechEnd = async (_) => {
            toggleVoiceProcessEvent(false)
        }
    }
    window.recordToggle = function(box_id,is_recording){
        bindingCallback(box_id);
        if(is_recording === true){
            window.myvad.start(); 
        }
        else{
            window.myvad.stop();
        }
    }
</script>
